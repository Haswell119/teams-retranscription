{{- if .Values.serviceAccounts.orchestrator.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hansard.serviceAccountName.orchestrator" . }}
  namespace: {{ include "hansard.namespace" . }}
  labels:
    {{- include "hansard.componentLabels" (dict "ctx" . "component" "orchestrator") | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.serviceAccounts.orchestrator.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The orchestrator is the only identity that talks to the Kubernetes API, and
# only inside this namespace (see rbac-orchestrator.yaml).
automountServiceAccountToken: {{ .Values.serviceAccounts.orchestrator.automountServiceAccountToken }}
{{- end }}
