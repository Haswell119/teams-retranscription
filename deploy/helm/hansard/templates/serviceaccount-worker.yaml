{{- if .Values.serviceAccounts.worker.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hansard.serviceAccountName.worker" . }}
  namespace: {{ include "hansard.namespace" . }}
  labels:
    {{- include "hansard.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.serviceAccounts.worker.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Workers pull from Redis and push to object storage. They have no Role bound
# to them at all, so no token is projected.
automountServiceAccountToken: {{ .Values.serviceAccounts.worker.automountServiceAccountToken }}
{{- end }}
