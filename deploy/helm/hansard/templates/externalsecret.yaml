{{- if include "hansard.capabilities.externalSecret" . }}
{{- /*
External Secrets Operator is a Pro+ entitlement on NKP. On Starter the CRD does
not exist, `enabled: auto` resolves to false and this file renders to nothing -
the install still succeeds, it just uses secrets.existingSecret instead.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "hansard.componentName" (dict "ctx" . "component" "secrets") }}
  namespace: {{ include "hansard.namespace" . }}
  labels:
    {{- include "hansard.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.externalSecret.secretStoreRef.name is required" .Values.secrets.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "hansard.componentName" (dict "ctx" . "component" "secrets") }}
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- with .Values.secrets.externalSecret.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.secrets.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
