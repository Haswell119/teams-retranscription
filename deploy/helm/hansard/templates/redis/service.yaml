{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hansard.redis.serviceName" . }}
  namespace: {{ include "hansard.namespace" . }}
  labels:
    {{- include "hansard.componentLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "hansard.componentSelectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
{{- end }}
