{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hansard.componentName" (dict "ctx" . "component" "secrets") }}
  namespace: {{ include "hansard.namespace" . }}
  labels:
    {{- include "hansard.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
# Only for evaluation and for GitOps repos that are themselves encrypted
# (SOPS / sealed-secrets). Production should use secrets.existingSecret or,
# on NKP Pro+, secrets.externalSecret.
stringData:
  {{- with .Values.secrets.data.apiKey }}
  HANSARD_API__API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.graphTenantId }}
  HANSARD_DELIVERY__GRAPH__TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.graphClientId }}
  HANSARD_DELIVERY__GRAPH__CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.graphClientSecret }}
  HANSARD_DELIVERY__GRAPH__CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.smtpUsername }}
  HANSARD_DELIVERY__SMTP__USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.smtpPassword }}
  HANSARD_DELIVERY__SMTP__PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.minutesApiKey }}
  HANSARD_MINUTES__API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.s3AccessKey }}
  HANSARD_STORAGE__ACCESS_KEY: {{ . | quote }}
  {{ $.Values.storage.s3.credentials.accessKeyKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.s3SecretKey }}
  HANSARD_STORAGE__SECRET_KEY: {{ . | quote }}
  {{ $.Values.storage.s3.credentials.secretKeyKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.redisPassword }}
  HANSARD_QUEUE_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
