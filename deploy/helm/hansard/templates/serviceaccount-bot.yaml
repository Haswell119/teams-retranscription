{{- if and .Values.bot.enabled .Values.serviceAccounts.bot.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hansard.serviceAccountName.bot" . }}
  namespace: {{ include "hansard.namespace" . }}
  labels:
    {{- include "hansard.componentLabels" (dict "ctx" . "component" "bot") | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.serviceAccounts.bot.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Smallest blast radius in the chart. The bot renders one meeting, in one
# origin, and receives a single-meeting join URL plus a pre-signed upload URL
# from the orchestrator. It never needs the Kubernetes API and never holds a
# long-lived credential, so the token is not mounted.
automountServiceAccountToken: {{ .Values.serviceAccounts.bot.automountServiceAccountToken }}
{{- end }}
