{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hansard.componentName" (dict "ctx" . "component" "worker-metrics") }}
  namespace: {{ include "hansard.namespace" . }}
  labels:
    {{- include "hansard.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  # Headless: this Service exists purely so a ServiceMonitor has endpoints to
  # discover. Workers are never addressed by clients.
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
      protocol: TCP
  # hansard.io/role spans both compute variants; app.kubernetes.io/component
  # does not, because it is worker-cpu on one and worker-gpu on the other.
  selector:
    {{- include "hansard.selectorLabels" . | nindent 4 }}
    hansard.io/role: worker
{{- end }}
