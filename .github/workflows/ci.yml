name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  HANSARD_RUNTIME__ALLOW_MODEL_DOWNLOADS: "false"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[api,asr-onnx,diarization,delivery,metrics,observability,dev]"

      - name: Lint
        run: .venv/bin/python -m ruff check src tests

      - name: Format check
        run: .venv/bin/python -m ruff format --check src tests

      - name: Type check
        run: .venv/bin/python -m mypy src/hansard

      - name: Tests
        run: .venv/bin/python -m pytest tests -q --cov=hansard --cov-report=term-missing:skip-covered

  no-comments:
    name: Code contains no comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert the convention holds
        run: python scripts/check_no_comments.py src/hansard

  documented-settings:
    name: Documentation matches the settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e .
      - name: Assert every documented setting exists
        run: .venv/bin/python scripts/check_documented_settings.py

  sovereignty:
    name: No network in the inference path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Create environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[asr-onnx,diarization,metrics,dev]"

      - name: Assert transcription opens no sockets
        run: .venv/bin/python scripts/check_no_egress.py

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Validate every posture
        run: deploy/helm/hansard/hack/validate.sh

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build CPU worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
