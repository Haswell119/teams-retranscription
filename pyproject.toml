[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hansard"
version = "0.1.0"
description = "Sovereign, self-hosted meeting transcription and minutes for Microsoft Teams. 100% local, open source."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hansard contributors" }]
keywords = ["speech-to-text", "transcription", "diarization", "microsoft-teams", "meeting-minutes", "self-hosted", "sovereign", "asr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "soundfile>=0.12",
  "structlog>=24.1",
  "httpx>=0.27",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
asr-onnx = ["onnx-asr[cpu,hub]>=0.12", "onnxruntime>=1.18"]
asr-onnx-gpu = ["onnx-asr[gpu,hub]>=0.12", "onnxruntime-gpu>=1.18"]
asr-whisper = ["faster-whisper>=1.1"]
diarization = ["onnxruntime>=1.18", "scipy>=1.13"]
diarization-torch = ["torch>=2.4", "nemo-toolkit[asr]>=2.3"]
capture = ["playwright>=1.45"]
delivery = ["aiosmtplib>=3.0", "msal>=1.30"]
metrics = ["jiwer>=3.0", "meeteval>=0.4", "unidecode>=1.3"]
observability = ["prometheus-client>=0.20"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "types-requests",
]

[project.scripts]
hansard = "hansard.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/Haswell119/teams-retranscription"
Documentation = "https://github.com/Haswell119/teams-retranscription/tree/main/docs"
Issues = "https://github.com/Haswell119/teams-retranscription/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hansard"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "TID", "ANN", "ERA"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/hansard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "slow: requires model downloads or long runtime",
  "integration: requires external services",
]
